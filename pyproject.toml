[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blenderterrain"
version = "0.1.0"
description = "Portable research foundation for importing official terrain data into Blender"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Enrique Fuster" }]
dependencies = [
  "numpy>=1.26,<2; python_version < '3.13'",
  "numpy>=2.1,<2.3; python_version >= '3.13'",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]
oracle = [
  "pyproj>=3.7",
  "rasterio>=1.4",
  "tifffile>=2025.1",
]

[tool.setuptools.packages.find]
include = ["blender_terrain*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
explicit_package_bases = true
exclude = "(^|[\\\\/])blender_terrain[\\\\/](addon\\.py|ui[\\\\/])"
files = [
  "blender_terrain/errors.py",
  "blender_terrain/models.py",
  "blender_terrain/core",
  "blender_terrain/io",
  "blender_terrain/providers",
]


[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "online: contacts an external service and is disabled by default",
  "oracle: requires a development-only raster oracle",
]

