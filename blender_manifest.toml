schema_version = "1.0.0"
id = "blender_terrain"
version = "0.5.0"
name = "BlenderTerrain"
tagline = "Import traceable terrain and imagery by area"
maintainer = "Enrique Fuster"
type = "add-on"
blender_version_min = "4.5.0"
license = ["SPDX:GPL-3.0-or-later"]
website = "https://github.com/EnriqueFuster/blenderterrain"
platforms = ["windows-x64", "linux-x64", "macos-x64", "macos-arm64"]
wheels = [
  "./wheels/certifi-2026.7.22-py3-none-any.whl",
  "./wheels/pyproj-3.7.2-cp311-cp311-macosx_13_0_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp311-cp311-macosx_14_0_arm64.whl",
  "./wheels/pyproj-3.7.2-cp311-cp311-manylinux_2_28_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp311-cp311-win_amd64.whl",
  "./wheels/pyproj-3.7.2-cp312-cp312-macosx_13_0_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp312-cp312-macosx_14_0_arm64.whl",
  "./wheels/pyproj-3.7.2-cp312-cp312-manylinux_2_28_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp312-cp312-win_amd64.whl",
  "./wheels/pyproj-3.7.2-cp313-cp313-macosx_13_0_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp313-cp313-macosx_14_0_arm64.whl",
  "./wheels/pyproj-3.7.2-cp313-cp313-manylinux_2_28_x86_64.whl",
  "./wheels/pyproj-3.7.2-cp313-cp313-win_amd64.whl",
]

[permissions]
network = "Download selected terrain and imagery products"
files = "Cache geospatial data and generated assets"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.artifacts/",
  "/.cache/",
  "/.git/",
  "/.github/",
  "/.mypy_cache/",
  "/.pytest_cache/",
  "/.pytest-tmp/",
  "/.tmp/",
  "/.ruff_cache/",
  "/.venv/",
  "/*.egg-info/",
  "/build/",
  "/dist/",
  "/scripts/",
  "/tests/",
  "/.gitattributes",
  "/.gitignore",
  "/pyproject.toml",
  "*.blend",
  "*.part",
  "*.tif",
  "*.tiff",
  "*.zip",
]
